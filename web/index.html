<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moxley-64M · Chat</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-name">Moxley-64M</div>
          <div class="brand-sub">SFT · streaming chat</div>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="status" class="status">连接中…</span>
        <button id="new-chat" class="ghost-button" type="button">新对话</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <footer class="composer">
      <details class="settings">
        <summary>生成参数</summary>
        <div class="settings-grid">
          <label>
            <span>temperature <b id="temperature-value">0.6</b></span>
            <input id="temperature" type="range" min="0" max="1.2" step="0.1" value="0.6">
          </label>
          <label>
            <span>top_p <b id="top-p-value">0.9</b></span>
            <input id="top-p" type="range" min="0.5" max="1" step="0.05" value="0.9">
          </label>
          <label>
            <span>最大生成长度</span>
            <select id="max-new-tokens">
              <option value="128">128</option>
              <option value="256">256</option>
              <option value="384">384</option>
              <option value="512" selected>512</option>
            </select>
          </label>
        </div>
      </details>

      <form id="composer-form" class="input-row">
        <textarea id="prompt" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…" autocomplete="off"></textarea>
        <button id="send" class="send-button" type="submit">发送</button>
        <button id="stop" class="stop-button" type="button" hidden>停止</button>
      </form>
      <div class="hint">本地模型推理 · 流式输出 · 生成内容可能不准确</div>
    </footer>
  </div>
</body>
</html>
