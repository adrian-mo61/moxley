[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moxley"
version = "0.1.0"
description = "A 64M-parameter LLM trained from scratch with BBPE and PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "tokenizers>=0.20",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["moxley*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
